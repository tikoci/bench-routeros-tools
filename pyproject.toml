[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bench-routeros-tools"
version = "0.1.0"
description = "Structural benchmark for RouterOS agent-support strategies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tikoci" }]
dependencies = [
  "mcp>=1.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "tiktoken>=0.7.0",
]

[tool.setuptools]
py-modules = []

